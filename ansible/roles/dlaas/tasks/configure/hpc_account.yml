---
- include_vars: "{{item}}"
  loop:
    - hpc_packages.yml
    - dtaas-tui.yml
  tags: ['hpc'] 

- name: Check HPC login node connection
  ansible.builtin.raw: "true"
  check_mode: false
  changed_when: false
  tags: ['hpc']

- name: Find a working Python interpreter on the HPC login node
  ansible.builtin.raw: |
    bash -lc '
      find_python() {
        for candidate in python3 python; do
          if command -v "$candidate" >/dev/null 2>&1 && "$candidate" -c "import sys; sys.exit(sys.version_info < (3, 6))" >/dev/null 2>&1; then
            command -v "$candidate"
            return 0
          fi
        done
        return 1
      }
      python=$(find_python) || {
        module load python >&2 || exit 1
        python=$(find_python) || exit 1
      }
      "$python" -c "import json, os, re, sys; print(json.dumps({\"interpreter\": sys.executable, \"environment\": {k: v for k, v in os.environ.items() if re.fullmatch(r\"[A-Za-z_][A-Za-z0-9_]*\", k)}}))"
    '
  register: hpc_python_probe
  check_mode: false
  changed_when: false
  failed_when: false
  no_log: true
  tags: ['hpc']

- name: Report missing HPC Python
  ansible.builtin.fail:
    msg: "No working Python 3.6 or newer was found on the HPC login node, and loading the python environment module failed or did not provide one."
  when: hpc_python_probe.rc != 0
  tags: ['hpc']

- name: Set HPC Python interpreter and environment
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ (hpc_python_probe.stdout_lines | last | from_json).interpreter }}"
    hpc_python_environment: "{{ (hpc_python_probe.stdout_lines | last | from_json).environment }}"
  no_log: true
  tags: ['hpc']

- name: Install python dependencies
  block:
    - name: Install packages in the HPC virtual environment
      ansible.builtin.pip:
        name: "{{ hpc_python_packages }}"
        virtualenv: "{{ config_server_venv_path }}"
        virtualenv_command: "{{ ansible_python_interpreter | quote }} -m venv"
      environment: "{{ hpc_python_environment }}"
      register: hpc_pip_result
      no_log: true
  rescue:
    - name: Report HPC Python dependency installation failure
      ansible.builtin.fail:
        msg: >-
          {{ hpc_pip_result.msg | default('Python dependency installation failed.') }}
          {{ hpc_pip_result.module_stderr | default('') }}
          {{ hpc_pip_result.module_stdout | default('') }}
  tags: ['hpc']

- name: Add HPC Login Node's host keys to DataLake Server account
  delegate_to: DataLake_as_a_Service
  ansible.builtin.known_hosts:
    name: "{{ hpc_login_node }}"
    key: "{{ item }}"
    state: present
  loop: "{{ hpc_login_node_ssh_host_keys }}"
  tags: ['infra','vm']