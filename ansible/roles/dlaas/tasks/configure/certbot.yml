---
- include_vars: certbot.yml

- name: Enable service Nginx 
  become: true
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
    
- name: Obtain TLS certificate with Let's Encrypt Certbot
  become: true
  command: 
    cmd: "{{ 'certbot certonly -n --nginx --agree-tos -d ' ~ dl_vm_internal_ip ~ '.nip.io -m  ' ~  certbot_email_account  }}"
    creates: "/etc/letsencrypt/live/{{ dl_vm_internal_ip ~ '.nip.io' }}/fullchain.pem"
  vars:
    # dl_vm_internal_ip: "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }}"
    dl_vm_internal_ip: "{{ lookup('ini', 'DataLake_as_a_Service ansible_host', file='inventory/hosts', section='cloud-infra') }}"

- name: Ensure Certbot deploy hook directory exists
  become: true
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: "0755"

- name: Reload Nginx after DataLake certificate renewal
  become: true
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/datalake-reload-nginx
    mode: "0755"
    content: |
      #!/bin/sh
      if [ "$RENEWED_LINEAGE" = "/etc/letsencrypt/live/{{ dl_vm_internal_ip }}.nip.io" ]; then
        systemctl reload nginx
      fi
  vars:
    dl_vm_internal_ip: "{{ lookup('ini', 'DataLake_as_a_Service ansible_host', file='inventory/hosts', section='cloud-infra') }}"
